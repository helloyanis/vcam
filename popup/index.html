<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vCam</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="settings">
        <label><input id="enabled" type="checkbox"> vCam enabled</label>
        <label><input id="disableRealCameras" type="checkbox"> Disable real cameras</label>
        <label>Camera type
            <select id="cameraType">
                <option value="front">Front camera</option>
                <option value="back">Back camera</option>
            </select>
        </label>
        <label>Camera name <input id="cameraName" type="text"></label>
        <button id="videoFeed" type="button">Start video feed</button>
    </div>
    <p id="status" role="status"></p>
    <a href="https://github.com/helloyanis/vcam" target="_blank">View source code / help</a>
    <script type="module" src="script.js"></script>

</body>
</html>
